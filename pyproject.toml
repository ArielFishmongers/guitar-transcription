[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gtab"
version = "0.1.0"
description = "Audio-to-guitar-tab signal processing pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
separation = ["demucs>=4.0", "torch>=2.0"]
transcription = ["basic-pitch>=0.3", "soundfile>=0.12"]
# FretNet/fusion: the gtab side only writes a WAV + reads JSON/npz. FretNet
# itself (amt_tools) runs in a SEPARATE conda env via subprocess (its deps
# conflict with gtab), so nothing heavy is installed here. See scripts/fretnet_worker.py.
fretnet = ["basic-pitch>=0.3", "soundfile>=0.12"]  # + a separate fretnet-repro env
midi = ["pretty_midi>=0.2"]
viz = ["matplotlib>=3.5"]
eval = ["mir_eval>=0.7", "mirdata>=0.3"]  # note-F1 + GuitarSet ground truth
dev = ["pytest>=7.0", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
